<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passwort vergessen - Einkaufsliste</title>
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-b">
<main>
  <div class="wrapper">
    <form id="forgot-form">
      <h1>PASSWORT VERGESSEN</h1>
      <p class="sub">Gib deine E-Mail-Adresse ein. Wir zeigen dir (statt einer echten Mail) direkt den Link zum Zurücksetzen.</p>
      <div class="input-box">
        <input type="email" id="forgot-email" placeholder="E-Mail-Adresse" autocomplete="email" required>
      </div>
      <button type="submit" class="btn">LINK ANFORDERN</button>
      <div class="links"><a href="index.html">Zurück zum Login</a></div>
    </form>
  </div>
</main>
<footer class="site-footer">© 2026 Tobias Bobek. Alle Rechte vorbehalten.</footer>

<div id="toast"></div>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script>
document.getElementById('forgot-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.getElementById('forgot-email').value.trim();
    if (!email) { toast('Bitte E-Mail-Adresse angeben.', 'error'); return; }

    const users = getUsers();
    const user = findUserByEmail(users, email);
    document.getElementById('forgot-email').value = '';

    if (!user) {
        toast('Falls diese E-Mail existiert, wurde ein Link angezeigt.', 'success');
        return;
    }
    const token = uid();
    user.resetToken = token;
    user.resetTokenExpiry = Date.now() + TOKEN_TTL_MS;
    saveUsers(users);

    showSimulatedMail(user.email, 'reset-password.html?token=' + token);
});
</script>
</body>
</html>
