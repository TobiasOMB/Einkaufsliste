<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neues Passwort - Einkaufsliste</title>
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-b">
<main>
  <div class="wrapper">
    <form id="reset-form">
      <h1>NEUES PASSWORT</h1>
      <p class="sub" id="reset-info">Bitte vergib ein neues Passwort für dein Konto.</p>
      <div class="input-box">
        <input type="password" id="reset-password" placeholder="Neues Passwort" autocomplete="new-password" required>
        <button type="button" class="toggle-pw" onclick="toggleFieldType('reset-password', this)">👁️</button>
      </div>
      <div class="input-box">
        <input type="password" id="reset-password2" placeholder="Passwort wiederholen" autocomplete="new-password" required>
        <button type="button" class="toggle-pw" onclick="toggleFieldType('reset-password2', this)">👁️</button>
      </div>
      <button type="submit" class="btn">PASSWORT SPEICHERN</button>
      <div class="links"><a href="index.html">Zurück zum Login</a></div>
    </form>
  </div>
</main>
<footer class="site-footer">© 2026 Tobias Bobek. Alle Rechte vorbehalten.</footer>

<div id="toast"></div>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token');
if (!token) {
    document.getElementById('reset-info').textContent = 'Kein gültiger Link erkannt. Bitte fordere einen neuen an.';
}

document.getElementById('reset-form').addEventListener('submit', (e) => {
    e.preventDefault();
    if (!token) { toast('Ungültiger Link.', 'error'); return; }

    const password = document.getElementById('reset-password').value;
    const password2 = document.getElementById('reset-password2').value;
    if (password.length < 6) { toast('Passwort muss mindestens 6 Zeichen haben.', 'error'); return; }
    if (password !== password2) { toast('Die Passwörter stimmen nicht überein.', 'error'); return; }

    const users = getUsers();
    const user = users.find(u => u.resetToken === token);
    if (!user || !user.resetTokenExpiry || user.resetTokenExpiry < Date.now()) {
        toast('Der Link ist ungültig oder abgelaufen.', 'error'); return;
    }
    user.password = password;
    user.resetToken = null;
    user.resetTokenExpiry = null;
    saveUsers(users);

    toast('Passwort erfolgreich geändert. Bitte einloggen.', 'success');
    setTimeout(() => (window.location.href = 'index.html'), 1400);
});
</script>
</body>
</html>
